<style>
/* Layout: sticky bar with XP, a home "mission map" of colour-coded cards (one colour per Eatwell food group), single-column missions with big pictures and instant feedback. */
:root{
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --bg:#F4F8F3; --surface:#FFFFFF; --ink:#13201A; --muted:#4E6057; --line:#D5E0D7;
  --accent:#E86F00; --on-accent:#1C0F00;
  --good:#17702F; --good-bg:#E1F3E5; --bad:#B3321F; --bad-bg:#FBE5E1;
  --veg:#1B7F37; --on-veg:#FFFFFF;
  --starch:#F5B301; --on-starch:#2A1E00;
  --dairy:#1E6BC0; --on-dairy:#FFFFFF;
  --protein:#C92A66; --on-protein:#FFFFFF;
  --oil:#7C5CC4; --on-oil:#FFFFFF;
  --treat:#5D6B64; --on-treat:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1612; --surface:#16211B; --ink:#E9F1EB; --muted:#A5B8AC; --line:#2A3A31;
    --accent:#FF9A3D; --on-accent:#1C0F00;
    --good:#5BD680; --good-bg:#13301D; --bad:#FF8A78; --bad-bg:#3A1B16;
    --veg:#46C26B; --on-veg:#06210F;
    --starch:#F5B301; --on-starch:#2A1E00;
    --dairy:#5BA3F0; --on-dairy:#04203F;
    --protein:#F0709F; --on-protein:#3D0820;
    --oil:#A38BEA; --on-oil:#1E0F4A;
    --treat:#8FA39B; --on-treat:#101A16;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1612; --surface:#16211B; --ink:#E9F1EB; --muted:#A5B8AC; --line:#2A3A31;
  --accent:#FF9A3D; --on-accent:#1C0F00;
  --good:#5BD680; --good-bg:#13301D; --bad:#FF8A78; --bad-bg:#3A1B16;
  --veg:#46C26B; --on-veg:#06210F;
  --starch:#F5B301; --on-starch:#2A1E00;
  --dairy:#5BA3F0; --on-dairy:#04203F;
  --protein:#F0709F; --on-protein:#3D0820;
  --oil:#A38BEA; --on-oil:#1E0F4A;
  --treat:#8FA39B; --on-treat:#101A16;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
[data-g="veg"]{--c:var(--veg);--o:var(--on-veg)}
[data-g="starch"]{--c:var(--starch);--o:var(--on-starch)}
[data-g="dairy"]{--c:var(--dairy);--o:var(--on-dairy)}
[data-g="protein"]{--c:var(--protein);--o:var(--on-protein)}
[data-g="oil"]{--c:var(--oil);--o:var(--on-oil)}
[data-g="treat"]{--c:var(--treat);--o:var(--on-treat)}
[data-g="accent"]{--c:var(--accent);--o:var(--on-accent)}
[data-g="ink"]{--c:var(--ink);--o:var(--bg)}

.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{background:none;border:0;padding:0;font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.01em}
.xp{font-weight:700;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums}
main.wrap{padding-block:20px 72px}

.hero{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:16px;align-items:center}
.kicker{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(2.2rem,9vw,3.6rem);font-weight:800;margin:6px 0 10px}
.hero p{max-width:46ch}
.hplate{width:100%;height:auto}
@media(max-width:420px){.hero{grid-template-columns:minmax(0,1fr) 88px}}
.prog{display:flex;align-items:center;gap:12px;margin:18px 0 22px;font-weight:700}
.meter{height:10px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.mcard{display:grid;grid-template-rows:auto 1fr auto;text-align:left;padding:0;border:2px solid var(--ink);border-radius:18px;background:var(--surface);overflow:hidden;min-width:0}
.pics{display:flex;gap:8px;justify-content:center;align-items:center;padding:16px;font-size:2.2rem;line-height:1.1;background:var(--c);color:var(--o)}
.mtxt{display:grid;gap:4px;padding:14px 16px 8px;min-width:0}
.mnum{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mtxt strong{font-family:var(--display);font-size:1.35rem;line-height:1.15}
.st{padding:0 16px 14px;font-weight:700}
.mcard.done .st{color:var(--good)}
.link{background:none;border:0;padding:6px 0;margin-top:22px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

.back{background:none;border:0;padding:8px 0;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px;justify-self:start}
.vhead{display:grid;gap:8px;margin-bottom:18px}
.vhead h2{font-size:clamp(1.9rem,7vw,2.7rem);font-weight:800}
.lead{color:var(--muted);max-width:60ch}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;min-width:0}
.card h3{font-size:1.35rem;margin-bottom:12px}
.card p+p{margin-top:10px}
.note{margin-top:12px;color:var(--muted);font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:8px}

.btn{min-height:48px;padding:10px 18px;border:2px solid var(--ink);border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.pill{background:var(--c);color:var(--o);border:2px solid var(--ink);border-radius:999px;padding:10px 16px;font-weight:700;margin-top:12px}
.center{text-align:center}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.col{flex-direction:column}
.opt{min-height:46px;padding:8px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700}
.opts.col .opt{width:100%;text-align:left}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);color:var(--ink);text-decoration:line-through}
.opt.dim{opacity:.45}
.fb{min-height:1.5em;margin-top:10px;font-weight:700}
.fb.good{color:var(--good)}
.fb.bad{color:var(--bad)}
.q{padding:14px 0;border-top:2px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.qt{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.qe{font-size:2.2rem;line-height:1}
.qt p{font-weight:700;font-size:1.05rem}

.plate{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:640px){.plate{grid-template-columns:minmax(0,320px) minmax(0,1fr);align-items:start}}
.plate svg{width:100%;max-width:340px;height:auto;margin:0 auto;display:block}
.slice path{fill:var(--c);stroke:var(--surface);stroke-width:4;cursor:pointer}
.slice.sel path,.slice:focus-visible path{stroke:var(--ink);stroke-width:6}
.slice:focus{outline:none}
.slice text{pointer-events:none}
.info{border-radius:14px;padding:16px;background:var(--c);color:var(--o);min-height:190px;display:grid;gap:8px;align-content:start}
.info h4{font-size:1.4rem}
.info .size{font-weight:700;opacity:.9}
.info .emo{font-size:2rem;letter-spacing:.2em}
.info .cnt{font-size:.9rem;font-weight:700;opacity:.85}

.sortc{text-align:center}
.sortc .meter{margin:0 0 14px}
.sorte{font-size:5rem;line-height:1.1}
.fbk{display:grid;gap:8px;margin-top:12px}.fbk>div{padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-size:.95rem}.fbk b{display:block;margin-bottom:2px}.ok-t{color:var(--good);font-weight:700}.no-t{color:var(--bad);font-weight:700}.rev{padding:10px 0;border-top:2px solid var(--line)}.rev:first-of-type{border-top:0}
.sortw{font-family:var(--display);font-size:2.1rem;font-weight:800;margin:28px 0 8px}
.gbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:16px}
.gb{background:var(--c);color:var(--o);border:2px solid var(--ink);border-radius:12px;min-height:54px;font-weight:700;padding:8px}
.gb.no{opacity:.3}
.gb.ok{outline:4px solid var(--good);outline-offset:2px}
.result{display:grid;gap:10px;justify-items:center;text-align:center;padding:8px 0}
.result .big{font-size:4rem;line-height:1}
.result h3{margin:0}

.tip{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:10px}
.tip.done{border-color:var(--good);background:var(--good-bg)}
.tipe{font-size:2.4rem;line-height:1;display:grid;place-items:center}
.tips{margin-bottom:10px;font-size:1.1rem}
.tn{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:700;font-size:.85rem;margin-right:6px}
.gap{border-bottom:3px dashed var(--accent);padding:0 4px;font-weight:700;letter-spacing:.12em}
.gap.filled{border-bottom-color:var(--good);color:var(--good);letter-spacing:0}

.flash{display:grid;place-items:center;align-content:center;gap:8px;min-height:250px;width:100%;text-align:center;padding:20px;background:var(--surface);border:2px solid var(--ink);border-radius:20px}
.flash .fe{font-size:4.6rem;line-height:1.1}
.flash .fw{font-family:var(--display);font-weight:800;font-size:2rem}
.flash .hint{color:var(--muted);font-size:.9rem}
.flash .def{font-size:1.15rem;max-width:30ch}
.tag{background:var(--accent);color:var(--on-accent);border-radius:6px;padding:1px 7px;font-size:.8rem;font-weight:700;margin-right:6px}
.ctl{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.cnum{align-self:center;font-weight:700;font-variant-numeric:tabular-nums}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mc{aspect-ratio:1;max-width:100%;border:2px solid var(--ink);border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;padding:4px;text-align:center;font-weight:700;min-width:0;overflow-wrap:anywhere;font-size:clamp(.7rem,3.2vw,1rem);line-height:1.15}
.mc.up{background:var(--surface);color:var(--ink)}
.mc.done{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.mc .me{font-size:clamp(1.6rem,8vw,2.4rem)}

.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.pp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--bg)}
.pp .av{font-size:2.4rem;line-height:1}
.pp strong{font-family:var(--display);font-size:1.15rem}
.faiths{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.fcard{padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--bg)}
.fcard h4{font-size:1.2rem;margin-bottom:6px}
.read{max-width:60ch}
.read p+p{margin-top:12px}
.words b{background:var(--accent);color:var(--on-accent);border-radius:6px;padding:0 6px}
ol.steps{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:10px;align-items:start}
ol.steps li::before{content:counter(s);display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:700}
.yours{min-height:3rem;margin-bottom:12px}

.fqh{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.fqe{font-size:4rem;line-height:1.1;margin:8px 0}
.fq h3{margin-bottom:14px;font-size:1.35rem}
.nxt{margin-top:12px}
.finbox{background:var(--good-bg);border:2px solid var(--good);border-radius:18px;padding:16px;display:grid;gap:10px;justify-items:start;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;padding:8px 18px;border-radius:999px;pointer-events:none;z-index:40}

@media (prefers-reduced-motion:no-preference){
  @keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
  @keyframes bump{50%{transform:scale(1.2)}}
  @keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:scale(1);opacity:1}}
  .opt.no,.gb.no{animation:shake .35s}
  .xp.bump{animation:bump .4s}
  .sorte,.flash .fe,.fqe{animation:pop .25s}
  .mcard{transition:transform .15s}
  .mcard:hover{transform:translateY(-3px)}
}
</style>

/* ---------- shared helpers ---------- */
function arc(a0,a1,r){
  var x0=150+r*Math.cos(a0),y0=150+r*Math.sin(a0),x1=150+r*Math.cos(a1),y1=150+r*Math.sin(a1);
  return 'M150 150 L'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+r+' '+r+' 0 '+((a1-a0)>Math.PI?1:0)+' 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+' Z';
}
var SL=[['starch',35],['oil',6],['dairy',12],['protein',12],['veg',35]];
var EMO={starch:'🍞',oil:'🫒',dairy:'🥛',protein:'🐟',veg:'🥦'};
function plateMarkup(label){
  var a=-Math.PI/2,out='';
  SL.forEach(function(s){
    var g=s[0],p=s[1],a1=a+p/100*2*Math.PI,mid=(a+a1)/2,r=g==='oil'?0.8:0.62,fs=p>=30?46:(g==='oil'?20:30);
    out+='<g class="slice" data-g="'+g+'"'+(label?' data-slice="'+g+'" tabindex="0" role="button" aria-label="'+G[g].n+'"':'')+'><path d="'+arc(a,a1,128)+'"/>'+
      (label?'<text x="'+(150+128*r*Math.cos(mid)).toFixed(1)+'" y="'+(150+128*r*Math.sin(mid)).toFixed(1)+'" font-size="'+fs+'" text-anchor="middle" dominant-baseline="central">'+EMO[g]+'</text>':'')+'</g>';
    a=a1;
  });
  return out;
}
function makeQuiz(box,items,onDone){
  var right=0;
  var sets=items.map(function(it){return it.fixed?it.o.slice():shuffle(it.o)});
  box.innerHTML=items.map(function(it,n){
    return '<div class="q" data-n="'+n+'"><div class="qt">'+(it.e?'<span class="qe" aria-hidden="true">'+it.e+'</span>':'')+'<p>'+it.q+'</p></div><div class="opts'+(it.col?' col':'')+'">'+
      sets[n].map(function(o){return '<button class="opt" data-o="'+o+'">'+o+'</button>'}).join('')+'</div><p class="fb" aria-live="polite"></p></div>';
  }).join('');
  box.onclick=function(e){
    var b=e.target.closest('.opt');if(!b||b.disabled)return;
    var q=b.closest('.q'),it=items[+q.dataset.n],fb=$('.fb',q);
    if(b.dataset.o===it.a){
      $$('.opt',q).forEach(function(x){x.disabled=true});
      b.classList.add('ok');fb.textContent=it.fb||'Correct!';fb.className='fb good';
      reward(q.dataset.w?3:10);right++;
      if(right===items.length&&onDone)onDone();
    }else{
      b.disabled=true;b.classList.add('no');q.dataset.w=1;fb.textContent='Try again.';fb.className='fb bad';
    }
  };
}
function complete(id){
  var first=!state.done[id];
  if(first){state.done[id]=1;save();reward(20);refreshHome()}
  var i=MISSIONS.findIndex(function(m){return m.id===id}),nx=MISSIONS[i+1];
  var all=MISSIONS.every(function(m){return state.done[m.id]});
  var fin=$('#v-'+id+' .fin');
  fin.innerHTML='<div class="finbox"><strong>Mission complete!</strong><span>'+(first?'+20 XP bonus. ':'Well done again. ')+(all?'You finished all 7 missions!':'')+'</span><div class="row">'+
    (nx?'<button class="btn" data-go="'+nx.id+'">Next: '+nx.title+'</button>':'')+'<button class="btn ghost" data-go="home">All missions</button></div></div>';
  if(fin.scrollIntoView)fin.scrollIntoView({block:'nearest'});
}

    if(n>=FQ.length){
      var pass=okCount>=7,t=okCount>=9?['🏆','Eatwell Champion']:(pass?['🥇','Plate Pro']:['🌱','Good start']);
      root.innerHTML='<div class="card"><div class="result"><div class="big" aria-hidden="true">'+t[0]+'</div><h3>'+t[1]+'</h3><p>'+okCount+' of '+FQ.length+' answers had the key content.'+(pass?'':' You need 7 to finish the mission.')+'</p><div class="row"><button class="btn" data-again>Play again</button><button class="btn ghost" data-go="home">All missions</button></div></div></div>'+
        '<div class="card"><h3>Your answers</h3>'+FQ.map(function(q,i){return '<div class="rev"><p class="note" style="margin:0"><b>'+(i+1)+'. '+q.q+'</b></p><p style="margin:6px 0 0"><span class="'+(okArr[i]?'ok-t':'no-t')+'">'+(okArr[i]?'Key content found':'Key content missing')+'</span><br>Your answer: '+(ans[i]?escH(ans[i]):'<i>(skipped)</i>')+'<br>Model answer: '+escH(q.m)+'</p></div>'}).join('')+'</div>';
      if(pass)complete('final');return;
    }
    var q=FQ[n];
    root.innerHTML='<div class="card fq"><div class="fqh"><span>Question '+(n+1)+' of '+FQ.length+'</span><span>Good answers '+okCount+'</span></div><div class="meter"><i style="width:'+(n/FQ.length*100)+'%"></i></div>'+
      '<h3>'+q.q+'</h3><p class="note" style="margin:0 0 10px">Write 1 or 2 full sentences.</p>'+
      '<textarea id="oa" rows="4" aria-label="Your answer" style="width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)"></textarea>'+
      '<div class="row" style="margin-top:12px"><button class="btn" data-check>Check my answer</button></div><div class="fbk" id="ofb" aria-live="polite"></div><div class="nxt"></div></div>';
    tries=0;
  }
  function nextBtn(){return '<button class="btn" data-next>'+(n===FQ.length-1?'See my result':'Next question')+'</button>'}
  root.onclick=function(e){
    if(e.target.closest('[data-again]')){n=0;okCount=0;ans=[];okArr=[];render();return}
    if(e.target.closest('[data-next]')){n++;render();return}
    var q=FQ[n];
    if(e.target.closest('[data-model]')){
      ans[n]=ans[n]||'';okArr[n]=!!okArr[n];
      $('#ofb',root).insertAdjacentHTML('beforeend','<div><b>Model answer</b>'+escH(q.m)+'</div>');
      $('.nxt',root).innerHTML=nextBtn();
      e.target.closest('[data-model]').remove();return;
    }
    if(e.target.closest('[data-retry]')){var ta=$('#oa',root);ta.focus();return}
    if(!e.target.closest('[data-check]'))return;
    var raw=$('#oa',root).value,fb=$('#ofb',root);
    if(raw.trim().split(/\s+/).filter(Boolean).length<4){fb.innerHTML='<div><span class="no-t">Write a full sentence (at least 4 words).</span></div>';return}
    tries++;ans[n]=raw.trim();
    var t=normT(raw),hits=q.k.map(function(k){return kHit(t,k)}),nh=hits.filter(Boolean).length,ok=nh>=q.min,voc=vUsed(t,q.v),gm=gramCheck(raw),gUsed=q.g.re.test(t);
    var h='<div><b>Content ('+nh+' of '+q.k.length+' points)</b>'+q.k.map(function(k,i){return '<span class="'+(hits[i]?'ok-t':'no-t')+'">'+(hits[i]?'✔ ':'✘ ')+escH(k.t)+'</span>'}).join('<br>')+'</div>';
    h+='<div><b>Vocabulary</b>'+voc.map(function(x){return '<span class="'+(x[1]?'ok-t':'')+'">'+(x[1]?'✔ ':'○ ')+escH(x[0])+'</span>'}).join(' &nbsp; ')+'<br><span class="note" style="margin:0">Topic words used: '+voc.filter(function(x){return x[1]}).length+' of '+voc.length+'.</span></div>';
    h+='<div><b>Grammar</b>'+(gm.length?gm.map(function(x){return '<span class="no-t">✘ '+escH(x)+'</span>'}).join('<br>'):'<span class="ok-t">✔ No common mistakes found.</span>')+'<br><span class="'+(gUsed?'ok-t':'no-t')+'">'+(gUsed?'✔ ':'✘ ')+'Focus: '+escH(q.g.t)+'</span><br><span class="note" style="margin:0">This is a quick check, not a full grammar check. Read your answer again.</span></div>';
    if(ok){
      if(!okArr[n]){okArr[n]=true;okCount++;reward(tries===1?10:3)}
      h+='<div><b>Model answer</b>'+escH(q.m)+'</div>';
      fb.innerHTML=h;$('.nxt',root).innerHTML=nextBtn();
    }else{
      fb.innerHTML=h+'<div><span class="no-t">Some key content is missing. Read the points above and try again.</span><div class="row" style="margin-top:8px"><button class="btn ghost" data-retry>Try again</button><button class="btn ghost" data-model>Show model answer</button></div></div>';
      $('.nxt',root).innerHTML='';
    }
  };
  render();
}

/* ---------- home, views, navigation ---------- */
var INIT={plate:initPlate,tips:initTips,words:initWords,diets:initDiets,faith:initFaith,halal:initHalal,final:initFinal};
var inited={};
var app=$('#app');
MISSIONS.forEach(function(m){
  var s=document.createElement('section');
  s.className='view';s.id='v-'+m.id;s.hidden=true;
  s.innerHTML='<div class="vhead"><button class="back" data-go="home">← All missions</button><h2>'+m.title+'</h2><p class="lead">'+m.lead+'</p></div><div class="body"></div>'+(m.id==='tips'||m.id==='diets'||m.id==='faith'||m.id==='halal'?'':'<div class="fin"></div>');
  app.appendChild(s);
});
$('#missionList').innerHTML=MISSIONS.map(function(m,i){
  return '<button class="mcard" data-go="'+m.id+'" data-g="'+m.g+'"><span class="pics" aria-hidden="true">'+m.pics+'</span><span class="mtxt"><span class="mnum">Mission '+(i+1)+'</span><strong>'+m.title+'</strong><span>'+m.sub+'</span></span><span class="st">Start</span></button>';
}).join('');
$('#hplate').innerHTML='<circle cx="150" cy="150" r="144" fill="var(--surface)" stroke="var(--accent)" stroke-width="6"/>'+plateMarkup(false);
function refreshHome(){
  var n=MISSIONS.filter(function(m){return state.done[m.id]}).length;
  $('#hprog').style.width=(n/MISSIONS.length*100)+'%';
  $('#hcount').textContent=n+' of '+MISSIONS.length+' done';
  $$('.mcard').forEach(function(b){
    var d=!!state.done[b.dataset.go];b.classList.toggle('done',d);$('.st',b).textContent=d?'Done ✓':'Start';
  });
}
var IDS=['home'].concat(MISSIONS.map(function(m){return m.id}));
function show(id){
  if(IDS.indexOf(id)<0)id='home';
  $$('.view').forEach(function(v){v.hidden=v.id!=='v-'+id});
  if(id!=='home'&&!inited[id]){inited[id]=1;INIT[id]($('#v-'+id+' .body'))}
  window.scrollTo(0,0);
  try{var want=id==='home'?'':id;if(location.hash.slice(1)!==want)location.hash=want}catch(e){}
}
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');
  if(g)show(g.dataset.go);
});
window.addEventListener('hashchange',function(){show(location.hash.slice(1))});
var resetArmed=false;
$('#reset').onclick=function(){
  var b=$('#reset');
  if(!resetArmed){resetArmed=true;b.textContent='Tap again to erase your XP and progress';setTimeout(function(){resetArmed=false;b.textContent='Reset my progress'},3500);return}
  resetArmed=false;state={xp:0,done:{}};save();
  $('#xpn').textContent='0';$$('.fin').forEach(function(f){f.innerHTML=''});
  refreshHome();b.textContent='Progress reset';
};
$('#xpn').textContent=state.xp;
refreshHome();
show(location.hash.slice(1));
})();
</script>

</body></html>
